name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # SwiftPM downloads the library from this repo's release (Package.swift's checksum).
      - name: Build (library and example)
        run: swift build
      - name: Test
        run: swift test
